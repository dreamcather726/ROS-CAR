<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #172033; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; fill: #526070; }
      .section-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #172033; }
      .card-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #172033; }
      .body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #354154; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #526070; }
      .tag { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eef6ff; stroke: #88b8e8; stroke-width: 2; rx: 8; }
      .box-green { fill: #eefaf3; stroke: #8ccfa5; stroke-width: 2; rx: 8; }
      .box-amber { fill: #fff7e7; stroke: #e3b55e; stroke-width: 2; rx: 8; }
      .box-red { fill: #fff1f1; stroke: #dc8b8b; stroke-width: 2; rx: 8; }
      .chip-ok { fill: #dff7e7; stroke: #5fb97d; stroke-width: 1.5; rx: 6; }
      .chip-build { fill: #fff0c8; stroke: #d4a336; stroke-width: 1.5; rx: 6; }
      .chip-risk { fill: #ffe2e2; stroke: #c96d6d; stroke-width: 1.5; rx: 6; }
      .chip-text-ok { fill: #23643b; }
      .chip-text-build { fill: #7a560f; }
      .chip-text-risk { fill: #8c3131; }
      .arrow { stroke: #3f536b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #6f7f91; stroke-width: 2.4; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 8 7; }
      .bus { stroke: #202b3c; stroke-width: 5; fill: none; marker-end: url(#arrow-dark); }
      .divider { stroke: #d6dde6; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3f536b"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6f7f91"/>
    </marker>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#202b3c"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text x="70" y="70" class="title">ESP32-S3 + MUSE PI ROS2 智能移动机械臂平台</text>
  <text x="70" y="105" class="subtitle">底盘闭环控制、IMU/编码器里程计、相机/雷达感知、机械臂执行，组合成可扩展的移动操作机器人</text>

  <rect x="70" y="145" width="600" height="280" class="box-blue"/>
  <text x="95" y="185" class="section-title">MUSE PI 上位机 / ROS2</text>
  <text x="95" y="220" class="body">• 运行 ROS2 节点、话题、GUI 和高层决策</text>
  <text x="95" y="250" class="body">• /cmd_vel 转左右轮速度命令，串口下发 ESP32</text>
  <text x="95" y="280" class="body">• 接收编码器、IMU 数据，发布 /car/odom 与 /car/imu</text>
  <text x="95" y="310" class="body">• 可接入相机、激光雷达、SLAM/Nav2、视觉识别</text>
  <text x="95" y="340" class="body">• 机械臂可扩展 MoveIt2 / 自定义逆解 / 抓取流程</text>
  <rect x="95" y="365" width="82" height="28" class="chip-ok"/>
  <text x="113" y="384" class="tag chip-text-ok">已起步</text>
  <rect x="190" y="365" width="118" height="28" class="chip-build"/>
  <text x="207" y="384" class="tag chip-text-build">协议待统一</text>

  <rect x="760" y="145" width="550" height="280" class="box-green"/>
  <text x="785" y="185" class="section-title">ESP32-S3 实时控制层</text>
  <text x="785" y="220" class="body">• 50 ms 增量 PID 速度闭环</text>
  <text x="785" y="250" class="body">• 双轮电机 PWM + 方向控制</text>
  <text x="785" y="280" class="body">• 四相编码器中断计数、速度估计</text>
  <text x="785" y="310" class="body">• MPU6050 DMP 姿态解算与零点校准</text>
  <text x="785" y="340" class="body">• 串口帧收发、超时停车、安全保护</text>
  <rect x="785" y="365" width="82" height="28" class="chip-ok"/>
  <text x="803" y="384" class="tag chip-text-ok">已实现</text>

  <rect x="70" y="495" width="310" height="180" class="box"/>
  <text x="95" y="535" class="card-title">底盘执行</text>
  <text x="95" y="570" class="body">双编码电机</text>
  <text x="95" y="600" class="body">PWM/方向控制</text>
  <text x="95" y="630" class="body">速度闭环与失联停车</text>

  <rect x="420" y="495" width="310" height="180" class="box"/>
  <text x="445" y="535" class="card-title">状态传感</text>
  <text x="445" y="570" class="body">轮式编码器：计数/速度</text>
  <text x="445" y="600" class="body">IMU：加速度/陀螺仪/RPY</text>
  <text x="445" y="630" class="body">可融合生成里程计</text>

  <rect x="770" y="495" width="310" height="180" class="box"/>
  <text x="795" y="535" class="card-title">环境感知</text>
  <text x="795" y="570" class="body">摄像头：画面、识别、目标定位</text>
  <text x="795" y="600" class="body">激光雷达：建图、避障、导航</text>
  <text x="795" y="630" class="body">可接 SLAM / Nav2</text>

  <rect x="1120" y="495" width="310" height="180" class="box-amber"/>
  <text x="1145" y="535" class="card-title">机械臂与末端</text>
  <text x="1145" y="570" class="body">舵机/关节控制</text>
  <text x="1145" y="600" class="body">编码反馈可扩展闭环</text>
  <text x="1145" y="630" class="body">移动抓取、搬运、交互</text>
  <rect x="1145" y="645" width="82" height="28" class="chip-build"/>
  <text x="1163" y="664" class="tag chip-text-build">调试中</text>

  <path d="M670 285 C710 285, 720 285, 760 285" class="bus"/>
  <text x="683" y="260" class="small">USB/UART 串口</text>
  <text x="687" y="315" class="small">命令下发 + 传感回传</text>

  <path d="M1035 425 L1035 495" class="arrow"/>
  <path d="M370 425 C370 465, 225 465, 225 495" class="arrow"/>
  <path d="M1035 425 C1035 465, 575 465, 575 495" class="arrow"/>
  <path d="M670 365 C740 455, 925 455, 925 495" class="arrow-soft"/>
  <path d="M670 335 C820 455, 1275 455, 1275 495" class="arrow-soft"/>

  <line x1="70" y1="720" x2="1430" y2="720" class="divider"/>

  <rect x="70" y="755" width="420" height="170" class="box-green"/>
  <text x="95" y="795" class="card-title">现在已经能展示的能力</text>
  <text x="95" y="830" class="body">• 上位机发布速度命令，底盘按目标速度运动</text>
  <text x="95" y="860" class="body">• ESP32 读取编码器/IMU 并按周期回传</text>
  <text x="95" y="890" class="body">• 具备闭环控制、串口通信、安全停车雏形</text>

  <rect x="530" y="755" width="420" height="170" class="box-amber"/>
  <text x="555" y="795" class="card-title">组合后可实现的功能</text>
  <text x="555" y="830" class="body">• 遥控/键盘/GUI 控车、速度闭环巡航</text>
  <text x="555" y="860" class="body">• 雷达建图导航、相机识别目标</text>
  <text x="555" y="890" class="body">• 移动到目标点后用机械臂抓取/放置</text>

  <rect x="990" y="755" width="440" height="170" class="box-red"/>
  <text x="1015" y="795" class="card-title">优先补齐风险点</text>
  <text x="1015" y="830" class="body">• ROS2 与 ESP32 串口协议统一为同一种帧格式</text>
  <text x="1015" y="860" class="body">• 发布标准 nav_msgs/Odometry 与 sensor_msgs/Imu</text>
  <text x="1015" y="890" class="body">• 机械臂 ROS2 话题/服务接口、TF、限位保护</text>

  <text x="70" y="970" class="small">评估依据：ESP32S3/helloWorld 与 ROS2/ros_car/src/my_pkg 现有代码，加上你的摄像头、激光雷达、MUSE PI、机械臂硬件描述。</text>
</svg>
